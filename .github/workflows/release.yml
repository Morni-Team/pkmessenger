# Vollautomatischer Release-Bau:
# Version in package.json erhöhen, nach main mergen – fertig.
#
# Der Workflow:
# - erkennt die Version aus package.json
# - erstellt den passenden Tag vX.Y.Z
# - baut und testet die App
# - veröffentlicht den Windows-Installer
# - erstellt automatische Release-Notizen
#
# Bereits vorhandene Tags werden niemals verschoben.

name: Release bauen

on:
  push:
    branches:
      - main
    # #107: kein paths-Filter mehr. Der analyze-Job hat eine vollständige Doppel-Release-Sperre (Tag existiert →
    # überspringen) und warnt sichtbar, wenn Code ohne Versionserhöhung auf main landet.
    tags:
      - "v*.*.*"

  release:
    types:
      - published

  workflow_dispatch:
    inputs:
      tag:
        description: "Vorhandenen Tag erneut bauen, z. B. v0.4.0; leer = aktueller Ref"
        required: false
        type: string

permissions:
  contents: read

# Releases immer nacheinander ausführen.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  analyze:
    name: Version erkennen und Release prüfen
    runs-on: ubuntu-latest

    outputs:
      skip: ${{ steps.check.outputs.skip }}
      tag: ${{ steps.check.outputs.tag }}
      ref: ${{ steps.check.outputs.ref }}
      create_tag: ${{ steps.check.outputs.create_tag }}

    steps:
      # „Run workflow“ mit einem Tag, den es (noch) nicht gibt, scheiterte sonst mit einer unverständlichen Git-Meldung
      - name: Angegebenen Tag prüfen (nur manuell)
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if ! gh api "repos/$REPO/git/ref/tags/$INPUT_TAG" >/dev/null 2>&1; then
            echo "::error::Den Tag $INPUT_TAG gibt es nicht. Für ein neues Update einfach die Version in package.json erhöhen und nach main bringen – der Tag entsteht dann automatisch."
            exit 1
          fi

      - name: Repository auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Bei Push-Events verwenden wir den unveränderlichen Commit-SHA.
          # Release- und manuelle Events verwenden den angegebenen Tag.
          ref: ${{ github.event.release.tag_name || inputs.tag || github.sha }}
          persist-credentials: false

      - name: Version und Ziel bestimmen
        id: check
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          VERSION="$(node -p "require('./package.json').version")"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$VERSION' in package.json hat nicht das Format X.Y.Z."
            exit 1
          fi

          # Normaler autonomer Release:
          # package.json wurde auf main geändert – oder „Run workflow“ auf main ohne Tag (Issue #12).
          if { [ "$EVENT" = "push" ] || { [ "$EVENT" = "workflow_dispatch" ] && [ -z "$INPUT_TAG" ]; }; } && [ "$GIT_REF" = "refs/heads/main" ]; then
            TAG="v$VERSION"
            TARGET_SHA="$SHA"

            echo "✔ Version $VERSION erkannt"
            echo "✔ Ziel-Tag: $TAG"
            echo "✔ Ziel-Commit: $TARGET_SHA"

            # Prüfen, ob der Tag bereits existiert.
            # Ein vorhandener Tag wird nie verschoben. Zeigt er auf einen älteren Commit, ist diese
            # Version schon veröffentlicht (z. B. package.json nur wegen Abhängigkeiten geändert) → überspringen.
            if EXISTING_SHA="$(gh api "repos/$REPO/commits/$TAG" --jq .sha 2>/dev/null)"; then
              if [ "$EXISTING_SHA" != "$TARGET_SHA" ]; then
                echo "ℹ Version $VERSION ist schon veröffentlicht (Tag $TAG auf $EXISTING_SHA) – nichts zu tun."
                echo "ℹ Für ein neues Update die Version in package.json erhöhen."
                # #107: Laut warnen, wenn seit dem letzten Release App-Code geändert wurde – sonst merkt keiner,
                # dass gemergte Fixes nie veröffentlicht werden.
                CHANGED="$(gh api "repos/$REPO/compare/$TAG...$TARGET_SHA" --jq '[.files[]?.filename | select(startswith("src/") or startswith("mobile/") or startswith("relay/"))] | length' 2>/dev/null || echo 0)"
                if [ "${CHANGED:-0}" -gt 0 ]; then
                  MSG="$CHANGED App-Datei(en) seit $TAG geändert, aber Version in package.json nicht erhöht – es wird KEIN Update veröffentlicht. Version erhöhen (z. B. per Bump-PR), dann baut dieser Workflow automatisch."
                  echo "::warning title=Kein Release – Version nicht erhöht::$MSG"
                  echo "### ⚠️ Kein Release" >> "$GITHUB_STEP_SUMMARY"
                  echo "$MSG" >> "$GITHUB_STEP_SUMMARY"
                fi
                {
                  echo "skip=true"
                  echo "tag=$TAG"
                } >> "$GITHUB_OUTPUT"
                exit 0
              fi

              echo "ℹ Tag $TAG existiert bereits korrekt."

              {
                echo "skip=false"
                echo "tag=$TAG"
                echo "ref=$TARGET_SHA"
                echo "create_tag=false"
              } >> "$GITHUB_OUTPUT"
            else
              echo "✔ Tag $TAG wird nach erfolgreicher Prüfung erstellt."

              {
                echo "skip=false"
                echo "tag=$TAG"
                echo "ref=$TARGET_SHA"
                echo "create_tag=true"
              } >> "$GITHUB_OUTPUT"
            fi

            exit 0
          fi

          # Tag-Push, veröffentlichter Release oder manueller Lauf.
          TAG="${RELEASE_TAG:-${INPUT_TAG:-$REF_NAME}}"

          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Ungültiger Release-Tag '$TAG'."
            echo "::error::Erwartet wird ein Tag im Format vX.Y.Z."
            echo "::error::Alternativ den Workflow auf main ohne Tag ausführen – dann gilt die Version aus package.json."
            exit 1
          fi

          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::package.json enthält Version $VERSION, der Tag ist $TAG."
            echo "::error::Setze package.json zuerst auf Version ${TAG#v}."
            exit 1
          fi

          # Bei Tag-Pushes den unveränderlichen Auslöser-Commit verwenden.
          # Dadurch wird kein beweglicher Tag erneut ausgecheckt.
          if [ "$EVENT" = "push" ]; then
            CHECKOUT_REF="$SHA"
          else
            CHECKOUT_REF="$TAG"
          fi

          echo "✔ Tag $TAG passt zu package.json $VERSION"
          echo "✔ Baue Commit/Ref: $CHECKOUT_REF"

          {
            echo "skip=false"
            echo "tag=$TAG"
            echo "ref=$CHECKOUT_REF"
            echo "create_tag=false"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Windows-Installer bauen und veröffentlichen
    needs: analyze
    if: needs.analyze.outputs.skip != 'true'
    runs-on: windows-latest

    permissions:
      contents: write

    env:
      TAG: ${{ needs.analyze.outputs.tag }}
      REF: ${{ needs.analyze.outputs.ref }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.analyze.outputs.ref }}
          persist-credentials: false

      - name: Node.js einrichten
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Tests ausführen
        run: npm test

      - name: Oberfläche bauen
        run: npm run build:renderer

      - name: Tag sicher und idempotent erstellen
        if: needs.analyze.outputs.create_tag == 'true'
        shell: bash
        run: |
          set -euo pipefail

          # Nach Tests erneut prüfen, weil ein anderer Lauf den Tag inzwischen
          # erstellt haben könnte.
          if EXISTING_SHA="$(gh api "repos/$REPO/commits/$TAG" --jq .sha 2>/dev/null)"; then
            if [ "$EXISTING_SHA" != "$REF" ]; then
              echo "::error::Tag $TAG zeigt auf $EXISTING_SHA statt auf $REF."
              exit 1
            fi

            echo "ℹ Tag $TAG wurde parallel bereits korrekt erstellt."
            exit 0
          fi

          # Tag auf dem exakt getesteten Commit erstellen.
          if gh api "repos/$REPO/git/refs" \
            -f "ref=refs/tags/$TAG" \
            -f "sha=$REF" >/dev/null 2>&1; then
            echo "✔ Tag $TAG wurde auf $REF erstellt."
            exit 0
          fi

          # Race Condition behandeln:
          # Ein anderer Lauf kann den Tag zwischen Prüfung und Erstellung
          # angelegt haben.
          EXISTING_SHA="$(gh api "repos/$REPO/commits/$TAG" --jq .sha 2>/dev/null || true)"

          if [ "$EXISTING_SHA" = "$REF" ]; then
            echo "ℹ Tag $TAG wurde parallel korrekt erstellt."
          else
            echo "::error::Tag $TAG konnte nicht sicher erstellt werden."
            exit 1
          fi

      - name: Electron-App bauen und veröffentlichen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-forge publish

      - name: Release-Notizen ergänzen
        shell: bash
        run: |
          set -euo pipefail

          BODY="$(gh release view "$TAG" \
            -R "$REPO" \
            --json body \
            --jq .body 2>/dev/null || true)"

          if [ -z "$BODY" ]; then
            gh api "repos/$REPO/releases/generate-notes" \
              -f "tag_name=$TAG" \
              --jq .body > notes.md

            gh release edit "$TAG" \
              -R "$REPO" \
              --notes-file notes.md

            echo "✔ Release-Notizen automatisch erstellt."
          else
            echo "ℹ Vorhandene Release-Notizen bleiben unverändert."
          fi

      - name: Zusammenfassung
        shell: bash
        run: |
          {
            echo "## ✔ PKMessenger $TAG veröffentlicht"
            echo
            echo "Installer und Update-Pakete hängen am Release **$TAG**."
            echo "Automatische Updates werden beim nächsten Start oder innerhalb von 6 Stunden erkannt."
          } >> "$GITHUB_STEP_SUMMARY"

  # Android-App (Issue #56): signierte APK bauen und an dasselbe Release hängen.
  # Der Signaturschlüssel liegt nur als Secret vor. Ohne ihn wird nur die APK übersprungen (Windows-Release bleibt gültig).
  android:
    name: Android-App (APK) bauen und anhängen
    needs: [analyze, build]
    if: needs.analyze.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    env:
      TAG: ${{ needs.analyze.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}

    steps:
      - name: Signaturschlüssel vorhanden?
        id: key
        shell: bash
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::warning::Kein Android-Signaturschlüssel (Secret ANDROID_KEYSTORE_B64) – die APK wird für $TAG übersprungen."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Repository auschecken
        if: steps.key.outputs.ok == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.analyze.outputs.ref }}
          persist-credentials: false

      - name: Node.js einrichten
        if: steps.key.outputs.ok == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Java 21 einrichten
        if: steps.key.outputs.ok == 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: APK bauen und signieren
        if: steps.key.outputs.ok == 'true'
        shell: bash
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          PK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          npm ci
          npm ci --prefix mobile
          node scripts/build-mobile.js
          (cd mobile && npx cap sync android)
          export PK_KEYSTORE="$RUNNER_TEMP/pk-release.p12"
          echo "$KS" | base64 -d > "$PK_KEYSTORE"
          chmod +x mobile/android/gradlew
          (cd mobile/android && ./gradlew --no-daemon assembleRelease)
          rm -f "$PK_KEYSTORE"
          APK=mobile/android/app/build/outputs/apk/release/app-release.apk
          SIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$SIGNER" verify --print-certs "$APK" | head -3
          cp "$APK" PKMessenger-android.apk

      - name: APK an das Release hängen
        if: steps.key.outputs.ok == 'true'
        shell: bash
        run: |
          gh release upload "$TAG" PKMessenger-android.apk --clobber -R "$REPO"
          {
            echo "## 📱 Android-App $TAG"
            echo
            echo "PKMessenger-android.apk hängt am Release. Installierte Apps finden das Update selbst (alle 6 Stunden)."
          } >> "$GITHUB_STEP_SUMMARY"

      # #167: zusätzlich ein EIGENES Android-Release (Tag android-vX.Y.Z) – dort liegt nur die APK, leicht zu finden.
      # Nie „latest“: die Update-Prüfung von PC und Handy liest /releases/latest und nur Tags der Form vX.Y.Z.
      - name: Eigenes Android-Release (android-vX.Y.Z)
        if: steps.key.outputs.ok == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ATAG="android-$TAG"
          {
            echo "📱 **PKMessenger für Android $TAG** – nur die APK."
            echo
            echo "1. **PKMessenger-android.apk** unten unter „Assets“ herunterladen (am Handy direkt öffnen)."
            echo "2. Installation aus „unbekannten Quellen“ für den Browser bzw. Dateimanager erlauben, wenn Android fragt."
            echo "3. Updates findet die App danach selbst."
            echo
            echo "Was neu ist: siehe das Haupt-Release [$TAG](https://github.com/$REPO/releases/tag/$TAG)."
          } > android-notes.md
          if gh release view "$ATAG" -R "$REPO" >/dev/null 2>&1; then
            gh release upload "$ATAG" PKMessenger-android.apk --clobber -R "$REPO"
          else
            gh release create "$ATAG" PKMessenger-android.apk -R "$REPO" --target "$(git rev-parse HEAD)" --title "📱 PKMessenger Android $TAG" --notes-file android-notes.md --latest=false
          fi
          echo "Eigenes Android-Release: https://github.com/$REPO/releases/tag/$ATAG" >> "$GITHUB_STEP_SUMMARY"
