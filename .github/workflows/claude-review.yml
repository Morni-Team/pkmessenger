# KI-Review für Pull Requests (Wunsch JoniMoni in #177, abgenickt von Philip: NUR Review).
# Claude liest die Änderungen eines PRs und kommentiert echte Probleme (Fehler, Sicherheit, fehlende Tests).
# Er schreibt KEINEN Code, pusht nichts und öffnet keine PRs – die Rechte unten erlauben nur Lesen + Kommentieren.
#
# Einrichten: Repo → Settings → Secrets and variables → Actions → „ANTHROPIC_API_KEY“ anlegen.
# Ohne Schlüssel wird der Job einfach übersprungen (kein roter Haken). Datei löschen = Review aus.
# Kosten: ein Lauf pro PR-Push (ältere Läufe desselben PRs werden abgebrochen), Doku-Änderungen lösen nichts aus.
name: KI-Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths-ignore: ["**/*.md", "docs/**", "LICENSE", ".gitignore"]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude prüft den PR
    # Keine Entwürfe, keine PRs aus Forks (die bekommen ohnehin keine Secrets) und keine Dependabot-PRs
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}

    steps:
      - name: Kein ANTHROPIC_API_KEY – Review übersprungen
        if: env.HAS_KEY != 'true'
        run: echo "::notice title=KI-Review aus::Secret ANTHROPIC_API_KEY fehlt – Review wird übersprungen."

      - name: Repository auschecken
        if: env.HAS_KEY == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Claude-Review
        if: env.HAS_KEY == 'true'
        uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1.0.252
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Kurzlebiges Workflow-Token mit genau den Rechten oben (kein persönlicher Token, keine App nötig)
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Eine Sammel-Antwort pro PR statt vieler Kommentare
          use_sticky_comment: true
          exclude_comments_by_actor: "dependabot[bot]"
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}

            Du prüfst diesen Pull Request für PKMessenger (Electron-App + Android/Capacitor, Discord-Bot-Steuerung).
            Antworte auf Deutsch, kurz und verständlich – die Leute im Team sind keine Profi-Entwickler.

            Melde NUR echte Probleme, jeweils mit Datei:Zeile und warum es kaputtgeht:
            1. Fehler: falsche Logik, Abstürze, kaputte Randfälle, Dinge, die auf Windows oder Android brechen.
            2. Sicherheit: Bot-Token/Geheimnisse (dürfen nie in Logs, Renderer oder an den Fernhilfe-Helfer),
               IPC ohne Prüfung in src/main/validate.js, aufgeweichte CSP, Fernhilfe-Rechte (help*.js).
            3. Fehlende oder falsche Tests für geänderte Logik (Tests: node:test in tests/).

            Keine Stil-Kleinigkeiten, kein Lob-Roman, keine Vermutungen ohne Beleg im Code.
            Konkrete Stellen als Inline-Kommentar; am Ende EINE kurze Zusammenfassung als PR-Kommentar
            (bei nichts Gefundenem: „Keine Probleme gefunden“ + ein Satz, was du geprüft hast).
            Ändere keine Dateien und führe keine Programme aus – nur lesen und kommentieren.
          claude_args: |
            --max-turns 25
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
