# Helfer-Seite für die Direktverbindung (#143) auf GitHub Pages – kostenlos, kein eigener Server nötig.
# Gebaut wird nur src/help-web + das P2P-Bündel (scripts/build-p2p.js). Keine Geheimnisse, keine Nutzerdaten.
name: Helfer-Seite (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'src/help-web/**'
      - 'src/shared/p2p.js'
      - 'scripts/build-p2p.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Node einrichten
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - name: Abhängigkeiten
        run: npm ci --ignore-scripts
      - name: Helfer-Seite bauen
        run: node scripts/build-p2p.js
      - name: Hochladen
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
