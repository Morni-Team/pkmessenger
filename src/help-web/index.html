<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' wss:; img-src 'self' data:; base-uri 'none'; form-action 'none'" />
    <title>PKMessenger – Helfer</title>
    <style>
      :root {
        --bg: #0f1117;
        --panel: #161a23;
        --panel2: #1e2330;
        --line: #2a3142;
        --text: #e8ecf3;
        --muted: #9aa3b5;
        --accent: #2dd4bf;
        --warn: #f87171;
      }
      * { box-sizing: border-box; }
      body { margin: 0; font: 15px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }
      header { padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--line); font-weight: 700; }
      main { padding: 16px; max-width: 760px; margin: 0 auto; }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
      label { display: block; margin: 10px 0 4px; color: var(--muted); font-size: 13px; }
      input { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); font: inherit; letter-spacing: 0.1em; text-transform: uppercase; }
      button { font: inherit; border: 0; border-radius: 999px; padding: 10px 16px; background: var(--panel2); color: var(--text); cursor: pointer; margin: 4px 0; }
      button.primary { background: var(--accent); color: #062b27; font-weight: 700; }
      .field { display: block; width: 100%; text-align: left; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 6px; padding: 10px 12px; background: var(--panel); }
      .field.secret { opacity: 0.6; cursor: not-allowed; }
      .muted { color: var(--muted); font-size: 13px; }
      .warn { color: var(--warn); }
      .screen { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
      .hidden { display: none !important; }
      #cursor { position: fixed; width: 16px; height: 16px; border: 2px solid var(--accent); border-radius: 50%; pointer-events: none; transition: all 0.15s; z-index: 50; }
    </style>
  </head>
  <body>
    <header>🙋 PKMessenger – Helfer</header>
    <main>
      <section id="connect" class="card">
        <h2>Verbinden</h2>
        <p class="muted">Du hilfst bei der Einrichtung. Chats und Nachrichten bleiben für dich verborgen.</p>
        <label for="name">Dein Name</label>
        <input id="name" maxlength="40" placeholder="z. B. Alex" style="text-transform: none; letter-spacing: normal" />
        <label for="code">Code vom anderen PC</label>
        <input id="code" maxlength="7" placeholder="ABCDEF" />
        <p><button id="go" class="primary">Verbinden</button></p>
        <p id="msg" class="muted"></p>
      </section>
      <section id="live" class="card hidden">
        <div class="screen" id="screen"></div>
        <div id="note" class="warn"></div>
        <div id="fields"></div>
        <p class="muted" id="control"></p>
        <p class="muted" id="via"></p>
      </section>
    </main>
    <div id="cursor" class="hidden"></div>
    <!-- relativ: läuft unter /help/ (PC, Relay) und auf GitHub Pages (/pkmessenger/help/) -->
    <script src="nacl.js"></script>
    <script src="p2p.js"></script>
    <script src="app.js"></script>
  </body>
</html>
